{% extends "index/index.html" %}
{% block body %}

<div class="lists-container">

  <div style="margin-bottom:2rem;">
    <p class="section-label">Browse</p>
    <h2 class="section-title">Available Tests</h2>
    <p class="section-subtitle">{{ tests|length }} tests available — click any to book it instantly</p>
  </div>

  <!-- Search Bar -->
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="test-search" class="form-control" placeholder="Search for a test…">
  </div>

  <!-- Test Grid -->
  <div class="test-grid">
    {% for test in tests %}
      <a href="{% url 'create' %}" class="test-chip">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
        {{ test }}
      </a>
    {% endfor %}
  </div>

  <div style="margin-top:2.5rem;text-align:center;">
    <a href="{% url 'create' %}" class="btn btn-primary btn-lg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Book a Test Now
    </a>
  </div>

</div>

{% endblock %}
